{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-person-gear me-2"></i>{{ title }}</h1>
</div>
<div class="card" style="max-width:700px;">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="col-12 mt-2">
          <button type="submit" class="btn btn-primary me-2"><i class="bi bi-save me-1"></i>Save</button>
          <a href="{% url 'users:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
